name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Must already exist in the repo, or will be created on the current commit."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          fi

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify GNU glibc compatibility
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: bash scripts/check-glibc.sh "target/${{ matrix.target }}/release/mcmap"

      - name: Package artifact
        id: package
        shell: bash
        run: |
          project_name="${{ github.event.repository.name }}"
          dirname="${project_name}-${TAG}-${{ matrix.target }}"
          mkdir "$dirname"

          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "target/${{ matrix.target }}/release/${project_name}.exe" "$dirname/"
            7z a "${dirname}.zip" "$dirname" >/dev/null
            echo "asset=${dirname}.zip" >> "$GITHUB_OUTPUT"
          else
            mv "target/${{ matrix.target }}/release/${project_name}" "$dirname/"
            tar -czf "${dirname}.tar.gz" "$dirname"
            echo "asset=${dirname}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload verified release package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified packages
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-packages

      - name: Create or update release and upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: |
            release-packages/${{ github.event.repository.name }}-${{ inputs.tag || github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            release-packages/${{ github.event.repository.name }}-${{ inputs.tag || github.ref_name }}-x86_64-unknown-linux-musl.tar.gz
            release-packages/${{ github.event.repository.name }}-${{ inputs.tag || github.ref_name }}-x86_64-pc-windows-msvc.zip
          fail_on_unmatched_files: true
