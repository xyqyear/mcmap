name: Integration tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: integration-build-${{ matrix.os }}-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify GNU glibc compatibility
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: bash scripts/check-glibc.sh "target/${{ matrix.target }}/release/mcmap"

      - name: Verify Minecraft chunk compatibility
        shell: bash
        run: |
          cargo test --locked -p mcmap-nbt --test contract --test community
          cargo test --locked -p fastanvil --lib --features flate2/zlib-rs
          cargo test --locked --bin mcmap
          cargo test --locked --test minecraft_26_3
          cargo test --locked --test nbt_commands

      - name: Verify optimized arithmetic and native decoding
        shell: bash
        run: |
          cargo test --release --locked -p fastanvil --lib --features flate2/zlib-rs render::tests
          cargo test --release --locked -p fastanvil --lib --features flate2/zlib-rs test::region_decompression::

      - name: Upload mcmap binary
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'mcmap-bin' || format('mcmap-bin-{0}', matrix.target) }}
          path: target/${{ matrix.target }}/release/mcmap${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1

  integration:
    name: ${{ matrix.flavor }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - forge-1.7.10-neid
          - forge-1.12.2-rei
          - vanilla-26.2
          - vanilla-latest

    env:
      MCMAP_INTEGRATION_TESTS: "1"
      MCMAP_FLAVOR: ${{ matrix.flavor }}
      MCMAP_TEST_CACHE: /tmp/mcmap-test-cache
      MCMAP_BIN: ${{ github.workspace }}/mcmap-bin/mcmap
      # NotEnoughIDs is hosted on GitHub Releases; an authenticated request
      # avoids the 60/hour anonymous rate limit on shared CI runners.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Download mcmap binary
        uses: actions/download-artifact@v8
        with:
          name: mcmap-bin
          path: mcmap-bin

      - name: Make mcmap executable
        run: chmod +x "$MCMAP_BIN"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: tests/integration/pyproject.toml

      - name: Restore mcmap-test-cache
        uses: actions/cache@v5
        with:
          path: /tmp/mcmap-test-cache
          key: mcmap-test-cache-${{ matrix.flavor }}-${{ hashFiles('tests/integration/cache.py', 'tests/integration/flavors.py') }}
          restore-keys: |
            mcmap-test-cache-${{ matrix.flavor }}-

      - name: Run integration tests
        working-directory: tests/integration
        run: >
          uv run pytest -ra
          test_download_client.py
          test_gen_palette.py
          test_remove_chunks.py
          test_replace_chunks.py
          test_render.py

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-${{ matrix.flavor }}
          path: |
            /tmp/mcmap-test-run-*/**/server.log
            /tmp/mcmap-test-run-*/**/preboot.log
            /tmp/mcmap-test-run-*/**/server.properties
            /tmp/mcmap-test-run-*/**/logs/**
          if-no-files-found: ignore
          retention-days: 7
