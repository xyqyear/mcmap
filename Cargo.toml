[package]
name = "mcmap"
version = "0.8.9"
edition = "2024"

[workspace]
members = ["vendor/fastanvil"]
default-members = ["."]
resolver = "3"

[dependencies]
ahash = "0.8.12"
clap = { version = "4.5.50", features = ["derive"] }
env_logger = "0.11.8"
fastanvil = { version = "0.32.0", path = "vendor/fastanvil" }
fastnbt = "2.6.1"
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-rs"] }
image = "0.23"
libdeflate-sys = "1.26.1"
log = "0.4.28"
lz4-java-wrc = "0.2.0"
mimalloc = { version = "0.1.52", default-features = false }
png = "0.16.8"
rayon = "1.11.0"
regex = "1.11.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
uzers = "0.12"

[profile.release]
# Whole-program optimizations. Slower to compile but noticeably faster
# for hot paths (NBT parsing, palette lookups) which live in different
# crates — LTO lets the optimizer inline across the boundary.
lto = "fat"
codegen-units = 1
